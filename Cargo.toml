[package]
name = "roomy"
version = "0.7.1"
license = "MIT"
description = "Find space you can free on your Mac, and clean it safely."
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
glob = "0.3.4"
libc = "0.2.191"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[dev-dependencies]
tempfile = "3.27.0"
