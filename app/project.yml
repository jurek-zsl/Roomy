name: Roomy
options:
  bundleIdPrefix: dev.roomy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Roomy:
    type: application
    platform: macOS
    sources:
      - path: Roomy
        excludes: ["AppIcon.icon", "LaunchAgents"]
      # The background agent for automatic cleaning (SMAppService.agent).
      - path: Roomy/LaunchAgents/dev.roomy.autoclean.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # Icon Composer icon: light, dark, clear (glass) and tinted, with
      # older-macOS images made from it at build time.
      - path: Roomy/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Roomy/Info.plist
      properties:
        CFBundleDisplayName: Roomy
        CFBundleShortVersionString: "0.8.0"
        # Sparkle compares this one: raise it with every release.
        CFBundleVersion: "0.8.0"
        # Updates: Sparkle reads the feed from the latest GitHub release.
        SUFeedURL: https://github.com/jurek-zsl/Roomy/releases/latest/download/appcast.xml
        SUPublicEDKey: A+2WzvBhudggwV0Ijgr6SeevxTMSsWwWbuidS6yWwbw=
        SUEnableAutomaticChecks: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSDocumentsFolderUsageDescription: Roomy looks in your Documents folder for build folders (like node_modules) that can be made again. Nothing is deleted unless you click Clean.
        NSDesktopFolderUsageDescription: Roomy looks on your Desktop for build folders that can be made again. Nothing is deleted unless you click Clean.
        NSDownloadsFolderUsageDescription: Roomy looks in Downloads for unfinished downloads. Nothing is deleted unless you click Clean.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roomy.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Roomy
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
      configs:
        # Release runs on Apple silicon and Intel Macs.
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: Sparkle
    postCompileScripts:
      - name: Build and bundle the Rust engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # Clean environment, so cargo sees the same settings as in Terminal
          # and doesn't rebuild everything each time.
          cargo_build() {
            env -i HOME="$HOME" PATH="$HOME/.cargo/bin:/usr/bin:/bin" \
              cargo build --release --quiet --manifest-path "$SRCROOT/../Cargo.toml" "$@"
          }
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          # Named roomy-engine: "roomy" would clash with "Roomy" on a case-insensitive disk.
          out="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/roomy-engine"
          if [ "$CONFIGURATION" = "Release" ]; then
            # One engine for both Apple silicon and Intel.
            cargo_build --target aarch64-apple-darwin
            cargo_build --target x86_64-apple-darwin
            lipo -create -output "$out" "$SRCROOT/../target/aarch64-apple-darwin/release/roomy" "$SRCROOT/../target/x86_64-apple-darwin/release/roomy"
            # lipo drops cargo's ad-hoc signature; the app's own signing needs one.
            codesign --force --sign - "$out"
          else
            cargo_build
            cp "$SRCROOT/../target/release/roomy" "$out"
          fi
  RoomyTests:
    type: bundle.unit-test
    platform: macOS
    # The core files are compiled straight into the tests (no host app), so
    # running tests doesn't open the window or the menu bar item.
    sources: [RoomyTests, Roomy/Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roomy.tests
        GENERATE_INFOPLIST_FILE: YES
  Snapshots:
    type: bundle.unit-test
    platform: macOS
    sources: [Snapshots, Roomy/Core, Roomy/Views]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roomy.snapshots
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Roomy:
    build:
      targets:
        Roomy: all
        RoomyTests: [test]
    test:
      targets: [RoomyTests]
  Snapshots:
    build:
      targets:
        Snapshots: [test]
    test:
      targets: [Snapshots]
