# Roomy's known folders.
#
# What the big folders on a Mac are, so Roomy can explain them at once,
# offline, without an AI. Add your own in
# ~/Library/Application Support/Roomy/known.toml (yours win).
#
#   path     a folder or a list of them. ~ is your home; * matches inside
#            one folder name, /**/ any number of folders.
#   name     a short name
#   owner    the app or tool it belongs to
#   what     one or two plain sentences: what it is, whether it comes back
#   kind     cache | appData | userFiles | buildOutput | aiModels |
#            toolchain | installers | logs | system
#   regrows  yes: it comes back by itself when it's needed
#            no: it's gone for good (or you have to fetch it yourself)
#            unsure
#   how      the proper way to free it, if there is one
#
# Roomy decides from kind and regrows (caches, models and build output that
# come back, logs and installers are worth reviewing; the rest is kept), and
# its usual checks still apply: a running app, your own folders, databases.
#
# The first match wins, so specific folders come before general patterns.

# ===========================================================================
# macOS itself
# ===========================================================================

[[folder]]
path = "/System/Library/AssetsV2/com_apple_MobileAsset_iOSSimulatorRuntime"
name = "iOS Simulator runtimes"
owner = "Xcode"
what = "The iOS versions Xcode's Simulator runs, stored by macOS. They only come back if you download them again in Xcode."
kind = "toolchain"
regrows = "no"
how = "Xcode > Settings > Components, or xcrun simctl runtime delete"

[[folder]]
path = ["/System/Library/AssetsV2/com_apple_MobileAsset_watchOSSimulatorRuntime", "/System/Library/AssetsV2/com_apple_MobileAsset_tvOSSimulatorRuntime", "/System/Library/AssetsV2/com_apple_MobileAsset_xrOSSimulatorRuntime", "/System/Library/AssetsV2/com_apple_MobileAsset_visionOSSimulatorRuntime"]
